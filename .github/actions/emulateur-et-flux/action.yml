# L'émulateur et les flux Maestro — UNE définition, appelée deux fois par
# android-e2e.yml : la première fois, puis une relève si qemu est tombé.
#
# Les réglages de l'émulateur portent chacun une panne mesurée ; ils ne
# doivent pas vivre en deux exemplaires qui divergeraient.

name: L'émulateur et les flux
description: Lève l'émulateur Android, installe la coque et joue les flux Maestro qui restent.

runs:
  using: composite
  steps:
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        # Image AOSP, sans services Google. La machine de GitHub (dépôt privé)
        # n'a que 2 processeurs et 8 Go : avec l'image google_apis, les
        # services Google saturaient l'émulateur (« bg anr » de
        # com.google.android.gms.persistent), Android tuait l'application
        # qui dépendait de leur fournisseur de polices, puis qemu lui-même
        # tombait (cœur vidé, exécution 39583495404). ML Kit n'y servait à
        # rien : le greffon refuse le scanner sur tout émulateur.
        target: default
        arch: x86_64
        profile: pixel_6
        # 3 Go plutôt que 4 : la machine partage sa mémoire avec Postgres,
        # l'API, le site et Maestro (voir l'étape d'échange ci-dessus).
        ram-size: 3072M
        disk-size: 6000M
        disable-animations: true
        # Pas de caméra émulée : le scanner ML Kit refuse de toute façon les
        # émulateurs (voir annuler-le-scanner.yaml), et la caméra virtuelle
        # coûte du processeur à une machine qui en manque.
        #
        # Rendu par ANGLE sur SwiftShader (swangle_indirect), plus
        # swiftshader_indirect : qemu tombait en SEGV dans son rendu GLES
        # cinq secondes après « Entrer », quand l'accueil se dessine
        # (coredumpctl, exécution 39587645730) — trois nuits de suite, au
        # même pas. (La WebView en --disable-gpu, essayée ensuite, plantait
        # son moteur de rendu : exécution 39591622354. On ne touche qu'au GPU
        # de l'émulateur.)
        emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        # Deux processeurs, rendu logiciel : l'interface système de l'émulateur
        # tarde, et Android pose « System UI isn't responding » par-dessus
        # l'application — les assertions ne voient plus l'écran, qui est
        # pourtant bien là (exécution 35091995778, capture de connexion). Ces
        # fenêtres d'erreur système sont masquées ; une vraie panne de
        # l'application reste visible, puisque son écran n'apparaît pas.
        #
        # Les sondes du diagnostic D25 (android/maestro-diagnostic) ne tournent
        # plus chaque nuit : elles ont rendu leur verdict (D27), coûtaient deux
        # connexions et un passage en mode avion avant les vrais flux, et
        # tombaient avec l'émulateur. Elles restent lançables à la main.
        #
        # Chaque ligne de `script` est un shell à part : la boucle des flux
        # (un flux à la fois, un seul rejeu sur déconnexion de l'émulateur,
        # jamais sur une assertion) vit dans android/maestro-ci.
        script: |
          adb wait-for-device
          adb shell settings put global hide_error_dialogs 1
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
          adb install -r android/app/build/outputs/apk/emulateur/debug/app-emulateur-debug.apk
          bash android/maestro-ci/lancer-les-flux.sh
