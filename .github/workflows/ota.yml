# La mise à jour en vol du bundle web — sans repasser par Google Play.
#
# La cadence du pilote est hebdomadaire ; la revue de Play prend des heures
# à des jours. Tout changement qui ne touche que le web part donc par Capgo,
# sur le canal de la cible, et la coque le prend au prochain démarrage. Un
# retour arrière est un clic par canal.
#
# Le bundle ne contient aucun secret : les clés des modèles sont dans l'API.
#
# La VERSION du bundle est celle du dépôt (package.json), sans suffixe : la
# coque refuse tout bundle dont la version est sous sa version native, et en
# semver « 0.1.1-2 » est SOUS « 0.1.1 ». Chaque mise à jour en vol est donc
# une version à part entière — 0.1.2, 0.1.3 — portée par l'étiquette
# `web-v<version>`, qui doit dire la même chose que package.json.
#
# Secret attendu : CAPGO_CLE (clé d'API Capgo, droit « upload »).
# Déclenchée par une étiquette `web-v*`, ou à la main avec le canal.

name: Mise à jour en vol

on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal Capgo"
        type: choice
        options: [staging, pilote, production]
        default: staging

jobs:
  # ===================================================== LE PORTAIL, ET POURQUOI
  #
  # 18 octobre 2026. La version 0.2.14 est partie sur le telephone du dirigeant
  # a 9 h 28 alors que la CI du MEME commit avait ECHOUE — une seule erreur de
  # forme, sans consequence a l'execution, mais le principe est le defaut : ce
  # flux se declenchait sur une etiquette et ne regardait rien.
  #
  # Le depot s'ouvre sur « une regle qu'aucune commande ne verifie n'est qu'un
  # souhait ». Celle-ci en etait une.
  #
  # Ce travail attend donc la CI du commit etiquete, et refuse de publier si
  # elle n'est pas verte. Il ATTEND au lieu d'echouer tout de suite, parce que
  # l'etiquette est souvent poussee dans la foulee du commit et que la CI
  # demarre a peine.
  portail:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: La CI du meme commit est verte
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Trente minutes : la CI du depot tient en moins de quinze, et une
          # file d'attente peut doubler cela. Au-dela, on refuse — un flux qui
          # attendrait sans fin ne dit plus rien.
          for i in $(seq 1 60); do
            etat=$(gh api "repos/$DEPOT/actions/runs?head_sha=$SHA&per_page=100"               --jq '[.workflow_runs[] | select(.name == "CI")] | first | "\(.status):\(.conclusion // "")"'               2>/dev/null || echo "")
            case "$etat" in
              completed:success)
                echo "CI verte sur $SHA — publication autorisee."
                exit 0 ;;
              completed:*)
                echo "::error::La CI de $SHA s'est terminee en « ${etat#completed:} ». Rien ne part sur les telephones."
                exit 1 ;;
              "")
                echo "($i/60) aucune execution de CI pour $SHA — j'attends qu'elle demarre." ;;
              *)
                echo "($i/60) CI « ${etat%%:*} » — j'attends." ;;
            esac
            sleep 30
          done
          echo "::error::Trente minutes sans verdict de la CI sur $SHA. Rien ne part sur les telephones."
          exit 1

  publier:
    needs: portail
    runs-on: ubuntu-latest
    env:
      CANAL: ${{ github.event.inputs.canal || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer
        run: npm ci

      # L'étiquette et le dépôt doivent dire la même version : un bundle
      # étiqueté 0.1.2 qui porterait 0.1.1 serait refusé par la coque, sans
      # un mot. Autant refuser ici, avec un mot.
      - name: Vérifier la version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version du dépôt : $VERSION"
          if [[ "${{ github.ref }}" == refs/tags/web-v* && "${{ github.ref_name }}" != "web-v$VERSION" ]]; then
            echo "::error::l'étiquette ${{ github.ref_name }} ne correspond pas à la version $VERSION du dépôt"
            exit 1
          fi

      - name: Construire le bundle de la coque
        run: npm run build:coque:${{ env.CANAL == 'production' && 'prod' || env.CANAL }} -w @malica/web

      # La CLI lit l'identifiant de l'app dans apps/web/capacitor.config.ts :
      # elle tourne donc de là.
      - name: Envoyer sur le canal
        working-directory: apps/web
        run: |
          npx @capgo/cli@latest bundle upload \
            --apikey "${{ secrets.CAPGO_CLE }}" \
            --channel "$CANAL" \
            --bundle "$(node -p "require('../../package.json').version")" \
            --path .output/public
