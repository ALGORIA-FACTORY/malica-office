# L'épreuve de nuit — chaque nuit, et à la demande.
#
# CE QU'ELLE ÉPROUVE : le PARCOURS APPLICATIF, à travers le relais et contre
# une vraie base — pages, session, référentiel, dépôt et relecture des octets,
# conversations, historique, transmission au cabinet — PUIS LA CHAÎNE DE
# LECTURE : une image lue par l'œil (Qwen-VL) et la désignation (DeepSeek), et
# une question à Malica (DeepSeek). Pour chaque appel, le journal écrit la
# route, le modèle et les jetons ; un appel sans jetons est un échec
# (`outils/epreuve-bout-en-bout.mjs --modeles`).
#
# Jusqu'au 17 septembre 2026, elle s'appelait « la chaîne réelle » et n'appelait
# aucun modèle : verte, sans un appel (exécution 34994665757).
#
# Coût mesuré sur les appels journalisés : de l'ordre de 0,05 $ par nuit au
# plus, soit environ 1,50 $ par mois.
#
# Secrets attendus : DEEPSEEK_API_KEY, QWEN_API_KEY, QWEN_BASE_URL — la lecture
# d'une photo et l'encodage des questions passent aujourd'hui par Qwen, la
# désignation et le conseil par DeepSeek. SANS EUX, L'ÉPREUVE S'ARRÊTE dès sa
# première étape, en rouge, et le dit : « chaîne de lecture non éprouvée, clés
# absentes ». Ni verte, ni silencieuse.

name: Épreuve de nuit

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC, 03:17 à Tunis
  workflow_dispatch:

jobs:
  bout-en-bout:
    runs-on: ubuntu-latest
    if: github.repository_owner != '' # ne tourne pas sur un fork sans secrets

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malica
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://malica_api:ci@localhost:5432/malica
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/malica
      JWT_SECRET: integration_continue_seulement_32_caracteres
      # Le jeu de données ouvre une session par compte, à la file, depuis une
      # seule adresse : la limite de trente connexions par minute — faite pour
      # freiner une devinette de mot de passe — le refuse (429). ci.yml la
      # relevait déjà ; cette épreuve de nuit ne la relevait pas, et échouait
      # chaque nuit depuis le 9 septembre 2026 sur « connexion refusée : 429 ».
      AUTH_ESSAIS_PAR_MINUTE: "1000"
      # Le contexte runner n'existe pas au niveau du job : un chemin fixe du runner Linux.
      STOCKAGE_RACINE: /tmp/malica-pieces
      CORS_ORIGINS: http://localhost:8080
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}

    steps:
      # Sans clés, rien de ce qui suit ne dirait la vérité sur la chaîne de
      # lecture : on s'arrête ici, et on le dit.
      - name: Les clés des modèles
        run: |
          manquantes=""
          [ -n "$DEEPSEEK_API_KEY" ] || manquantes="$manquantes DEEPSEEK_API_KEY"
          [ -n "$QWEN_API_KEY" ] || manquantes="$manquantes QWEN_API_KEY"
          [ -n "$QWEN_BASE_URL" ] || manquantes="$manquantes QWEN_BASE_URL"
          if [ -n "$manquantes" ]; then
            echo "::error title=Chaîne de lecture non éprouvée::chaîne de lecture non éprouvée, clés absentes :$manquantes"
            exit 1
          fi
          echo "clés présentes : DEEPSEEK_API_KEY, QWEN_API_KEY, QWEN_BASE_URL"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer
        run: npm ci

      - name: Monter le schéma
        run: node db/migrer.mjs --base "$DATABASE_URL_ADMIN" --mot-de-passe-api
        env:
          MALICA_API_PASSWORD: ci

      - name: Démarrer l'API et le site
        run: |
          (npm run start -w @malica/api > api.log 2>&1 &)
          (npm run dev -w @malica/web > web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/sante >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/sante

      - name: Peupler le jeu de données
        run: node outils/jeu-de-donnees.mjs http://localhost:8080

      # La chaîne réelle parle avec le compte de développement
      # (dev@malica.local) : c'est le jeu d'essai du développeur qui le crée,
      # comme dans ci.yml. Sans lui, la connexion est refusée (401). Ce défaut
      # était caché derrière le 429 du jeu de données, qui arrêtait le job
      # une étape plus tôt.
      - name: Le jeu d'essai du développeur
        run: node db/dev/jeu_dessai.mjs
        env:
          MALICA_API_URL: http://localhost:3000

      - name: Le parcours applicatif et la chaîne de lecture (modèles)
        run: node outils/epreuve-bout-en-bout.mjs http://localhost:8080 --modeles

      - name: Journaux des serveurs
        if: failure()
        run: |
          echo "::group::api"; tail -200 api.log; echo "::endgroup::"
          echo "::group::web"; tail -100 web.log; echo "::endgroup::"
