# La relecture ciblée par Claude — la mesure réelle, sur le code de production.
#
# DÉCISION du dirigeant (8 novembre 2026) : activée, avec Haiku, en arrière-plan.
# Sur les pièces que le Sudoku ne prouve pas faute de solution, Claude relit
# les CASES de montant découpées de l'image (la ligne pour le contexte, la case
# agrandie). Sa lecture n'est qu'un candidat : la pièce n'est prouvée que si le
# moteur referme toutes ses contraintes avec elle — l'exception à R2, bornée.
#
# Ce workflow mesure ce qui TOURNE : le banc `apps/api/tests/real/
# banc-relecture-ciblee.ts` appelle les modules de production (cases, découpe,
# requête, plan candidat), avec le modèle et la consigne EN BASE
# (`public.relecture_ciblee_configuration`, R8, R10), puis le banc sans IA est
# rejoué sur les relevés candidats, et `relire.py bilan` compare.
#
# Les relevés OCR sont ceux du passage 3 de « Mesure Claude » (run 42477888334,
# artefact `mesure-claude`). Plafond : 5 $ au tarif en base.

name: Relecture Claude

on:
  # Mesure payante : lancée à la main seulement (Actions › Run workflow),
  # jamais par une poussée — depuis le nettoyage du 8 novembre 2026, le banc vit sur main.
  workflow_dispatch:

concurrency:
  group: relecture-claude
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ !contains(github.event.head_commit.message, '[sans banc]') }}

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banc
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/banc
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OCR_URL: http://127.0.0.1:8095
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/banc
      PLAFOND: "5"

    steps:
      - name: La clé
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Mesure non faite::ANTHROPIC_API_KEY absente"
            exit 1
          fi
          echo "ANTHROPIC_API_KEY : présente"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Le service OCR (infra/ocr), construit
        uses: docker/build-push-action@v7
        with:
          context: infra/ocr
          file: infra/ocr/Dockerfile
          tags: malica-ocr:mesure
          load: true
          cache-from: type=gha,scope=malica-ocr
          cache-to: type=gha,mode=max,scope=malica-ocr

      - name: Le service OCR, démarré (relecture des cellules du banc)
        run: |
          docker run -d --name ocr -p 8095:8000 \
            -e OMP_NUM_THREADS=2 -e OCR_LECTEURS=2 \
            -e OCR_MODELE_RECONNAISSANCE_ARABE=arabic_PP-OCRv5_mobile_rec \
            malica-ocr:mesure
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8095/sante && break
            sleep 5
          done
          curl -fsS http://127.0.0.1:8095/sante

      - name: Les relevés OCR du passage 3 de « Mesure Claude »
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mesure-claude
          path: precedent
          run-id: 42477888334
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer
        run: |
          npm ci
          python -m pip install --quiet pillow==11.3.0

      - name: Le moteur du sudoku
        run: |
          rustup target add wasm32-unknown-unknown
          npm run build --workspace @malica/sudoku

      - name: Monter le schéma
        run: node db/migrer.mjs --base "$DATABASE_URL_ADMIN" --mot-de-passe-api
        env:
          MALICA_API_PASSWORD: ci

      - name: La référence (moteur seul, relevé PaddleOCR v5)
        run: |
          mkdir -p sortie/releves
          [ -d precedent/releves ] && cp -r precedent/releves/. sortie/releves/ || true
          echo "relevés repris : $(ls sortie/releves | wc -l)"
          set +e
          node --experimental-strip-types --no-warnings apps/api/src/malica/lecture/banc-sans-ia.ts \
            --corpus algoria:outils/jeu-algoria --corpus synthetique:outils/jeu-synthetique \
            --corpus dirigeant:packages/sudoku/tests/donnees/jeux_dirigeant_ocr.json \
            --cache sortie/releves --sortie sortie/base.json > sortie/base.md 2> sortie/base.err
          echo "code : $?"; head -4 sortie/base.md

      - name: La relecture (code de production), puis le moteur rejoué sur les relevés candidats
        run: |
          set +e
          node --experimental-strip-types --no-warnings apps/api/tests/real/banc-relecture-ciblee.ts \
            --base sortie/base.json --cache sortie/releves --racine . \
            --sortie sortie/releves-relus --journal sortie/journal.json \
            --plafond "$PLAFOND" 2> sortie/relecture.err
          echo "relecture : $?"; tail -3 sortie/relecture.err
          node --experimental-strip-types --no-warnings apps/api/src/malica/lecture/banc-sans-ia.ts \
            --corpus algoria:outils/jeu-algoria --corpus synthetique:outils/jeu-synthetique \
            --corpus dirigeant:packages/sudoku/tests/donnees/jeux_dirigeant_ocr.json \
            --cache sortie/releves-relus --sortie sortie/relu.json > sortie/relu.md 2> sortie/relu.err
          echo "banc : $?"; head -3 sortie/relu.md; grep -h "valeur(s) affirmée" sortie/relu.err || echo "0 faux affirmé"
          python outils/relecture-claude/relire.py bilan --base sortie/base.json \
            --journaux sortie/journal.json --relus sortie/relu.json --sortie sortie/bilan.md
          cat sortie/bilan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Le journal du service OCR
        if: always()
        run: docker logs ocr > sortie/ocr.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relecture-claude
          path: |
            sortie/
            !sortie/releves/
            !sortie/releves-*/
          retention-days: 30
