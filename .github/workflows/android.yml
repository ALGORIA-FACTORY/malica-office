# La coque Android : le bundle web, le projet Gradle, un AAB signé, et son
# envoi sur une piste de Google Play.
#
# Déclenchée par une étiquette `android-v*` (la version du dépôt), ou à la
# main avec la saveur et la piste. Le magasin ne sert qu'aux changements
# natifs — un greffon, une permission, une montée de Capacitor — ; le bundle
# web, lui, part par `ota.yml` sans repasser par la revue de Play.
#
# Secrets attendus :
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD   la clé d'envoi (Play garde la clé de signature)
#
# Variables attendues (pas des secrets : rien ici n'ouvre quoi que ce soit
# sans le jeton OIDC que GitHub ne délivre qu'à CE dépôt) :
#   PLAY_FOURNISSEUR_IDENTITE   le fournisseur d'identité fédérée du projet
#       Google Cloud « regalica-office » — projects/<numéro>/locations/global/
#       workloadIdentityPools/github/providers/github-actions — dont la
#       condition n'accepte que wbarouni/regalica-office
#   PLAY_COMPTE_DE_SERVICE      publication-play@regalica-office.iam.gserviceaccount.com,
#       invité dans Play Console avec le droit « Publier sur les pistes de test »
#
# Aucune clé de compte de service n'existe, nulle part : le workflow échange
# son jeton OIDC contre un accès d'une heure. Rien à faire tourner, rien à
# voler, rien à révoquer.
#
# Le premier AAB d'une application neuve s'envoie à la main dans Play Console :
# l'API refuse de créer la toute première version. Les deux premières versions
# (0.1.0 (1) et 0.1.1 (2)) l'ont été ; le numéro de version part donc de 3.

name: Android

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      # La CIBLE est l'adresse de l'API que le bundle web embarque
      # (`apps/web/.env.coque-<cible>`). La saveur Gradle en découle : `prod`
      # pour la production, `pilote` pour tout le reste — le paquet est le
      # même, seule l'adresse change. Tant que le serveur pilote n'existe pas,
      # la piste de test interne tourne sur staging.
      cible:
        description: "Adresse de l'API embarquée : staging, pilote ou prod"
        type: choice
        options: [staging, pilote, prod]
        default: staging
      piste:
        description: "Piste Play"
        type: choice
        options: [internal, alpha, production]
        default: internal

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Le jeton OIDC que Google Cloud échange contre un accès au compte de service.
      id-token: write
    env:
      CIBLE: ${{ github.event.inputs.cible || 'staging' }}
      SAVEUR: ${{ github.event.inputs.cible == 'prod' && 'prod' || 'pilote' }}
      PISTE: ${{ github.event.inputs.piste || 'internal' }}
      # Le contexte secrets n'est pas lisible dans le `if` d'une étape : on
      # décide ici, au niveau du job, si la clé et le compte de service existent.
      CLE_PRESENTE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      PLAY_PRESENT: ${{ vars.PLAY_FOURNISSEUR_IDENTITE != '' && vars.PLAY_COMPTE_DE_SERVICE != '' }}
      # Le numéro de version : monotone, jamais réutilisé. Les deux premiers
      # (1 et 2) ont été construits sur le poste ; on décale le numéro du
      # workflow pour ne jamais retomber dessous — Play refuserait l'AAB.
      DECALAGE_VERSION: 2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 impose le JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Installer
        run: npm ci

      # Le bundle web porte la cible : `.env.coque-<saveur>` — des adresses
      # publiques suivies par git, jamais une clé.
      - name: Construire le bundle de la coque
        run: npm run build:coque:$CIBLE -w @regalica/web

      - name: Synchroniser le projet Android
        run: npm run coque:sync -w @regalica/web

      - name: Poser la clé d'envoi
        if: env.CLE_PRESENTE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/regalica-upload.jks
          cat > android/keystore.properties <<EOF
          storeFile=regalica-upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # La version du dépôt, et le numéro du workflow — monotone, jamais réutilisé.
      - name: Construire l'AAB
        working-directory: android
        env:
          github_run_number: ${{ github.run_number }}
        run: |
          SAVEUR_MAJ="$(echo "$SAVEUR" | sed 's/./\U&/')"
          ./gradlew "bundle${SAVEUR_MAJ}Release" \
            -PversionName="$(node -p "require('../package.json').version")" \
            -PversionCode="$((github_run_number + DECALAGE_VERSION))" \
            --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: aab-${{ env.CIBLE }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/*/*.aab
            android/app/build/outputs/mapping/*/mapping.txt
          retention-days: 90

      # L'identité : le jeton OIDC de ce run, échangé contre un accès d'une
      # heure au compte de service. Le fichier d'identifiants écrit ici est un
      # « compte externe », sans secret — l'action d'envoi le lit comme des
      # identifiants par défaut de l'application.
      - name: S'identifier auprès de Google Cloud
        if: env.PLAY_PRESENT == 'true'
        id: identite
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_FOURNISSEUR_IDENTITE }}
          service_account: ${{ vars.PLAY_COMPTE_DE_SERVICE }}

      - name: Envoyer sur Google Play
        if: env.PLAY_PRESENT == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: ${{ steps.identite.outputs.credentials_file_path }}
          packageName: com.algoriafactory.regalica
          releaseFiles: android/app/build/outputs/bundle/*/*.aab
          tracks: ${{ env.PISTE }}
          status: completed
          whatsNewDirectory: android/whatsnew
