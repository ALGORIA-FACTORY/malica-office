# Déployer une version sur le pilote ou la production — à la main, jamais seul.
#
# On donne l'étiquette (v0.3.1 : ses images existent, images.yml les a
# publiées) et l'environnement. L'environnement GitHub `pilote` et
# `production` exigent une approbation : la même personne relit ce qu'elle
# envoie. Revenir en arrière est le même geste avec l'étiquette d'avant.
#
# Le même bouton RELIT aussi le journal des pannes (21 novembre 2026) : on
# laisse la version vide et l'on donne les références que l'écran a citées
# (« 28AE8D15,FE93C5BF »), ou un nombre de jours pour relire les lectures de
# pièces échouées. Même approbation, même tunnel, même porte SSH
# (infra/porte-ssh.sh, commandes « journal » et « lectures ») ; rien n'est
# déposé ni déployé, et la base est lue en transaction en lecture seule.

name: Déployer

on:
  workflow_dispatch:
    inputs:
      environnement:
        description: "Où"
        type: choice
        options: [pilote, production]
        default: pilote
      version:
        description: "Étiquette du dépôt (v0.3.1) — vide pour relire le journal"
        type: string
        required: false
      journal:
        description: "Références des pannes à relire (28AE8D15,FE93C5BF) — seulement si la version est vide"
        type: string
        required: false
      lectures:
        description: "Ou : relire les lectures échouées de ces N derniers jours (1 à 7) — seulement si la version est vide"
        type: string
        required: false

concurrency:
  group: deployer-${{ github.event.inputs.environnement }}
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    # Le jeton du job lit le code et les images de l'organisation, rien d'autre.
    permissions:
      contents: read
      packages: read
      # Le pilote sur Google Cloud : un jeton OIDC échangé contre une identité
      # Google de quelques minutes (Workload Identity) — aucune clé Google ici.
      id-token: write
    environment:
      name: ${{ github.event.inputs.environnement }}
      url: https://${{ vars.DOMAINE }}
    steps:
      - name: Vérifier la demande
        env:
          VERSION: ${{ github.event.inputs.version }}
          JOURNAL: ${{ github.event.inputs.journal }}
          LECTURES: ${{ github.event.inputs.lectures }}
        run: |
          if [ -z "$VERSION" ]; then
            if [ -n "$LECTURES" ]; then
              [ -z "$JOURNAL" ] || { echo "des références OU un nombre de jours, pas les deux" >&2; exit 1; }
              [[ "$LECTURES" =~ ^[1-7]$ ]] || { echo "lectures : un nombre de jours, de 1 à 7" >&2; exit 1; }
              exit 0
            fi
            [[ "$JOURNAL" =~ ^[0-9A-F]{8}(,[0-9A-F]{8}){0,19}$ ]] \
              || { echo "sans version, une à vingt références de huit chiffres hexadécimaux (28AE8D15,FE93C5BF), ou un nombre de jours de lectures, sont attendus" >&2; exit 1; }
            exit 0
          fi
          [ -z "$JOURNAL$LECTURES" ] || { echo "une version OU une relecture, pas les deux" >&2; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] \
            || { echo "une étiquette v<majeure>.<mineure>.<correctif> est attendue" >&2; exit 1; }

      # Le serveur ne détient rien (infra/deployer.sh) : il n'a ni le code ni
      # l'accès au registre. Ce job DÉPOSE le commit de l'étiquette, puis PRÊTE
      # un jeton le temps du « pull », exactement comme images.yml le fait pour
      # le staging. Sans le dépôt, `deployer <version>` s'arrête sur
      # « refs/depose/<version> introuvable » ; sans le jeton, le « pull » des
      # images privées répond « unauthorized ».
      - uses: actions/checkout@v7
        if: github.event.inputs.version != ''
        with:
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      # ================================== POURQUOI UN TUNNEL SUR GOOGLE CLOUD
      #
      # 15 novembre 2026. Le pilote vit sur Google Cloud, et son port SSH n'est
      # PAS ouvert à Internet : seul le proxy IAP de Google y entre, au nom
      # d'une identité qui en a le droit. Le job prend cette identité par
      # Workload Identity (le jeton OIDC de CE dépôt, de CET environnement),
      # ouvre un tunnel IAP vers le port 22, et parle à la même porte SSH
      # qu'ailleurs, par localhost. Les environnements sans
      # GCP_FOURNISSEUR_IDENTITE passent tout droit, comme avant.
      - name: Google Cloud — identité du déploiement
        if: vars.GCP_FOURNISSEUR_IDENTITE != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_FOURNISSEUR_IDENTITE }}
          service_account: ${{ vars.GCP_COMPTE_DEPLOI }}

      - name: Google Cloud — outils
        if: vars.GCP_FOURNISSEUR_IDENTITE != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Google Cloud — tunnel IAP vers le port 22
        if: vars.GCP_FOURNISSEUR_IDENTITE != ''
        env:
          PROJET: ${{ vars.GCP_PROJET }}
          ZONE: ${{ vars.GCP_ZONE }}
          MACHINE: ${{ vars.GCP_MACHINE }}
          PORT: ${{ vars.DEPLOI_PORT }}
        run: |
          # Le premier lancement de gcloud et l'essai de connexion d'IAP
          # prennent plus de 30 s sur un runner neuf (15 novembre 2026 : 30 s
          # n'ont pas suffi, journal vide). On attend 120 s, et l'on s'arrête
          # tout de suite si le tunnel meurt, avec son journal.
          gcloud compute start-iap-tunnel "$MACHINE" 22 --project="$PROJET" --zone="$ZONE" \
            --local-host-port="localhost:$PORT" >/tmp/tunnel.log 2>&1 &
          tunnel=$!
          for _ in $(seq 120); do
            if (exec 3<>"/dev/tcp/127.0.0.1/$PORT") 2>/dev/null; then
              cat /tmp/tunnel.log
              exit 0
            fi
            kill -0 "$tunnel" 2>/dev/null || break
            sleep 1
          done
          echo "le tunnel IAP ne s'ouvre pas (machine éteinte ? elle dort de 0 h à 10 h) :" >&2
          cat /tmp/tunnel.log >&2
          gcloud compute instances describe "$MACHINE" --project="$PROJET" --zone="$ZONE" --format='value(status)' >&2 || true
          exit 1

      - name: Relire le pilote (journal des pannes ou lectures échouées), en lecture seule
        if: github.event.inputs.version == ''
        env:
          CLE: ${{ secrets.DEPLOI_CLE_SSH }}
          HOTE: ${{ vars.DEPLOI_HOTE }}
          PORT: ${{ vars.DEPLOI_PORT || '22' }}
          EMPREINTE: ${{ vars.DEPLOI_EMPREINTE_HOTE }}
          JOURNAL: ${{ github.event.inputs.journal }}
          LECTURES: ${{ github.event.inputs.lectures }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploi
          chmod 600 ~/.ssh/deploi
          printf '%s\n' "$EMPREINTE" > ~/.ssh/known_hosts
          # La demande a été vérifiée plus haut ; la porte la revérifie.
          if [ -n "$LECTURES" ]; then demande="lectures $LECTURES"; else demande="journal $JOURNAL"; fi
          ssh -i ~/.ssh/deploi -p "$PORT" -o BatchMode=yes "malica@$HOTE" "$demande" </dev/null

      - name: Déposer ${{ github.event.inputs.version }}, puis déployer sur ${{ github.event.inputs.environnement }}
        if: github.event.inputs.version != ''
        env:
          CLE: ${{ secrets.DEPLOI_CLE_SSH }}
          HOTE: ${{ vars.DEPLOI_HOTE }}
          PORT: ${{ vars.DEPLOI_PORT || '22' }}
          EMPREINTE: ${{ vars.DEPLOI_EMPREINTE_HOTE }}
          VERSION: ${{ github.event.inputs.version }}
          JETON: ${{ secrets.GITHUB_TOKEN }}
          # Les secrets d'application, posés dans l'environnement GitHub visé
          # (pilote ou production), jamais recopiés du staging. Absents, ils
          # partent vides et le serveur n'y touche pas.
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          CLICTOPAY_UTILISATEUR: ${{ secrets.CLICTOPAY_UTILISATEUR }}
          CLICTOPAY_MOT_DE_PASSE: ${{ secrets.CLICTOPAY_MOT_DE_PASSE }}
          FLOUCI_CLE_PUBLIQUE: ${{ secrets.FLOUCI_CLE_PUBLIQUE }}
          FLOUCI_CLE_PRIVEE: ${{ secrets.FLOUCI_CLE_PRIVEE }}
          # L'adresse publique (liens des courriels, CORS, certificat), et un
          # second nom servi le temps d'une bascule. Des variables : rien de
          # secret. Absentes, le serveur garde celles de son .env.
          DOMAINE: ${{ vars.DOMAINE }}
          DOMAINE_ALIAS: ${{ vars.DOMAINE_ALIAS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploi
          chmod 600 ~/.ssh/deploi
          printf '%s\n' "$EMPREINTE" > ~/.ssh/known_hosts

          git bundle create /tmp/depot.bundle HEAD
          ssh -i ~/.ssh/deploi -p "$PORT" -o BatchMode=yes "malica@$HOTE" \
            "deposer $VERSION" < /tmp/depot.bundle

          # Le nom, le jeton, puis les secrets d'application, sur l'entrée
          # standard et jamais sur la ligne de commande. Le nom doit être celui
          # du porteur du jeton (voir images.yml).
          printf '%s\n%s\nBREVO_API_KEY=%s\nANTHROPIC_API_KEY=%s\nDEEPSEEK_API_KEY=%s\nQWEN_API_KEY=%s\nDOMAINE=%s\nDOMAINE_ALIAS=%s\nCLICTOPAY_UTILISATEUR=%s\nCLICTOPAY_MOT_DE_PASSE=%s\nFLOUCI_CLE_PUBLIQUE=%s\nFLOUCI_CLE_PRIVEE=%s\nPAIEMENT_SIMULATEUR=non\n' \
            "$GITHUB_ACTOR" "$JETON" "$BREVO_API_KEY" "$ANTHROPIC_API_KEY" "$DEEPSEEK_API_KEY" "$QWEN_API_KEY" "$DOMAINE" "$DOMAINE_ALIAS" \
            "$CLICTOPAY_UTILISATEUR" "$CLICTOPAY_MOT_DE_PASSE" "$FLOUCI_CLE_PUBLIQUE" "$FLOUCI_CLE_PRIVEE" |
            ssh -i ~/.ssh/deploi -p "$PORT" -o BatchMode=yes "malica@$HOTE" "deployer $VERSION"

  # L'application suit le serveur (le dirigeant, 23 novembre 2026). Le pilote
  # était en 0.2.119 et le téléphone en 0.2.111 : aucune mise à jour en vol
  # n'était jamais partie sur le canal « pilote ». Une version déployée part
  # donc aussi vers l'application de son environnement, par `ota.yml`, qui
  # attend lui-même que la CI du commit soit verte.
  application:
    needs: deployer
    if: github.event.inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Envoyer ${{ github.event.inputs.version }} vers l'application (${{ github.event.inputs.environnement }})
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          VERSION: ${{ github.event.inputs.version }}
          CANAL: ${{ github.event.inputs.environnement }}
        run: gh workflow run ota.yml --repo "$DEPOT" --ref "$VERSION" -f canal="$CANAL"
