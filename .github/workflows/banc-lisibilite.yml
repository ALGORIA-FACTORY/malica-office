name: Banc de la lisibilite (temporaire)

on:
  pull_request:
    paths:
      - .github/workflows/banc-lisibilite.yml

jobs:
  banc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://malica_api:ci@localhost:5432/malica
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/malica
      JWT_SECRET: integration_continue_seulement_32_caracteres
      MALICA_API_PASSWORD: ci
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Avant puis apres, sur le meme runner
        run: |
          M=db/migrations/20261231350000_la_lisibilite_ne_se_replanifie_plus.sql
          cp $M /tmp/m.sql
          for cote in avant apres; do
            psql -h localhost -U postgres -qc "drop database if exists malica with (force)" -c "create database malica"
            if [ $cote = avant ]; then rm $M; else cp /tmp/m.sql $M; fi
            node db/migrer.mjs --base "$DATABASE_URL_ADMIN" --mot-de-passe-api | tail -1
            psql -h localhost -U postgres -d malica -Atc "select l.lanname from pg_proc p join pg_language l on l.oid=p.prolang where p.oid='app.piece_lisible(uuid)'::regprocedure"
            for i in 1 2 3; do
              (cd apps/api && STOCKAGE_RACINE=$RUNNER_TEMP/p node --experimental-strip-types --import ./src/garde-base-de-test.ts \
                --test --test-name-pattern="200 pièces" src/la-tva-du-mois-tient-la-charge.test.ts) \
                | grep -E "# temps" | sed "s/^/$cote $i /"
            done
          done
