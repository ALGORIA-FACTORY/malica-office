# Les images, et le staging qui les suit.
#
# À chaque poussée sur main et à chaque étiquette `v*`, les trois images
# (api, web, sauvegarde) sont construites et publiées sur GHCR sous la même
# étiquette que le dépôt — `main` ou `v0.3.1` — plus l'empreinte git. Puis,
# sur main seulement, le staging se déploie tout seul : `deployer main`.
#
# SUR MAIN SEULEMENT, et c'est le déclencheur ci-dessous qui le tient, pas ce
# commentaire. Jusqu'au 15 septembre 2026, la branche du chantier Android
# déclenchait aussi le déploiement : pousser `application-android` jouait des
# migrations en superutilisateur sur la base qu'interroge l'application
# publiée sur Google Play, sans relecture ni approbation — pendant que cet
# en-tête affirmait déjà « sur main seulement ». Un déploiement du staging est
# un geste voulu : il passe par main.
#
# Le pilote et la production ne se déploient jamais d'ici : deployer.yml, à la
# main, sur une étiquette, avec l'approbation que l'environnement GitHub exige.
#
# Chaque environnement GitHub (staging, pilote, production) porte :
#   variables  DEPLOI_HOTE (l'adresse), DEPLOI_EMPREINTE_HOTE (la ligne known_hosts), DOMAINE
#   secret     DEPLOI_CLE_SSH (la clé privée dont la publique est dans ~malica/.ssh/authorized_keys, derrière porte-ssh.sh)

name: Images

on:
  push:
    # Le staging suit main, et main seule (voir l'en-tête).
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # `ocr` est le second lecteur. Son image est lourde — PaddleOCR et ses
        # poids — et c'est pour cela qu'elle est construite ICI, une fois, et
        # non sur le serveur : la machine de staging a deux processeurs et une
        # base de donnees a servir.
        image: [api, web, sauvegarde, ocr]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom est mis en minuscules par l'action : GHCR l'exige.
      - id: etiquettes
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/malica-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: ${{ (matrix.image == 'sauvegarde' || matrix.image == 'ocr') && format('infra/{0}', matrix.image) || '.' }}
          file: ${{ (matrix.image == 'sauvegarde' || matrix.image == 'ocr') && format('infra/{0}/Dockerfile', matrix.image) || format('infra/{0}.Dockerfile', matrix.image) }}
          push: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          labels: ${{ steps.etiquettes.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  staging:
    needs: publier
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    # Le jeton du job sert à TIRER les images : le serveur n'en a plus aucun.
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://${{ vars.DOMAINE }}
    steps:
      # ============================================ LE SERVEUR NE DÉTIENT RIEN
      #
      # 12 octobre 2026. Le dépôt est passé sous l'organisation, et le
      # déploiement s'est arrêté net : l'organisation INTERDIT les clés de
      # déploiement, et le jeton personnel posé sur le serveur ne pouvait plus
      # lire les images devenues celles de l'organisation.
      #
      # Le déménagement fut l'occasion, pas la cause. Un serveur qui va
      # CHERCHER son code et ses images a besoin d'un accès permanent au dépôt
      # entier et au registre — ce qu'une organisation refuse, et ce qu'on ne
      # veut pas laisser sur une machine exposée.
      #
      # Le sens est donc inversé : ce job, qui vient de compiler, DÉPOSE le
      # code et PRÊTE un jeton le temps d'un « pull ».
      - uses: actions/checkout@v7
        with:
          # Le paquet git porte le commit déployé ; un dépôt tronqué n'en
          # ferait pas un lisible par le serveur.
          fetch-depth: 0

      - name: Déposer le code, puis déployer
        env:
          CLE: ${{ secrets.DEPLOI_CLE_SSH }}
          HOTE: ${{ vars.DEPLOI_HOTE }}
          EMPREINTE: ${{ vars.DEPLOI_EMPREINTE_HOTE }}
          BRANCHE: ${{ github.ref_name }}
          JETON: ${{ secrets.GITHUB_TOKEN }}
          # Les secrets d'application, posés dans l'environnement « staging »
          # de GitHub. Absents, ils partent vides et le serveur n'y touche pas.
          # Le secret prime ; à défaut, la variable du même nom (posée ainsi
          # le 20 octobre 2026 — à convertir en secret, puis retirer ce repli).
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || vars.BREVO_API_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploi
          chmod 600 ~/.ssh/deploi
          printf '%s\n' "$EMPREINTE" > ~/.ssh/known_hosts

          # Le paquet ne porte que le commit déployé et ce qui le relie à
          # l'histoire : le serveur n'a pas besoin du reste.
          git bundle create /tmp/depot.bundle HEAD
          ssh -i ~/.ssh/deploi -o BatchMode=yes "malica@$HOTE" \
            "deposer $BRANCHE" < /tmp/depot.bundle

          # Le nom et le jeton partent sur l'entrée standard, jamais sur la ligne
          # de commande : un argument se lit dans la liste des processus.
          #
          # Le NOM compte autant que le jeton. Avec un nom qui n'est pas celui du
          # porteur, GHCR accepte la connexion et délivre une autorisation VIDE :
          # le « login » réussit, le « pull » répond « unauthorized », et aucun des
          # deux ne dit pourquoi. C'est exactement ce qui est arrivé au premier
          # essai réel de ce chemin.
          #
          # Après eux, les secrets d'application, une ligne NOM=valeur chacun :
          # deployer.sh ne retient que ceux de sa liste.
          printf '%s\n%s\nBREVO_API_KEY=%s\n' "$GITHUB_ACTOR" "$JETON" "$BREVO_API_KEY" |
            ssh -i ~/.ssh/deploi -o BatchMode=yes "malica@$HOTE" "deployer $BRANCHE"
