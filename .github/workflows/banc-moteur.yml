# Le banc du moteur seul — la référence OCR + Sudoku, sans aucun modèle.
#
# CE QU'IL MESURE (`apps/api/src/malica/lecture/banc-sans-ia.ts`, lecteur
# `paddle`, le défaut) : le service OCR du dépôt (`infra/ocr/`, PP-OCRv5 mobile
# en ONNX, construit ici, sur CPU) relève les trois corpus du dépôt, et le
# moteur du sudoku prouve ce qu'il peut. Aucun appel à un modèle : le banc ne
# coûte rien d'autre que la machine.
#
# C'est LE chiffre daté dont partent les chantiers de lecture (lecture arabe,
# rattrapage de nuit) : prouvées / 411, faux, inventés, échanges, et la médiane
# OCR par page. Il se lance à la main (Actions › Run workflow), sur n'importe
# quelle branche : « avant » sur main, « après » sur le chantier.
#
# Les relevés OCR sont gardés en cache (même clé que « Mesure Claude ») : une
# relance avec le même service et les mêmes corpus ne relit pas les images.
#
# Sortie : le bulletin dans le résumé du job ET dans le journal (lisible sans
# télécharger l'artefact), l'artefact `banc-moteur` (mesures JSON, bulletin,
# journal, relevés gardés).
name: Banc du moteur

on:
  workflow_dispatch:
    inputs:
      cas:
        description: "Cas à rejouer seuls (ex. 001,042) ; vide : tous"
        required: false
        default: ""

concurrency:
  group: banc-moteur-${{ github.ref }}
  cancel-in-progress: false

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banc
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/banc
      OCR_URL: http://127.0.0.1:8095

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Le service OCR (infra/ocr), construit
        uses: docker/build-push-action@v7
        with:
          context: infra/ocr
          file: infra/ocr/Dockerfile
          tags: malica-ocr:banc
          load: true
          cache-from: type=gha,scope=malica-ocr
          cache-to: type=gha,mode=max,scope=malica-ocr

      - name: Le service OCR, démarré
        run: |
          docker run -d --name ocr -p 8095:8000 \
            -e OMP_NUM_THREADS=2 -e OCR_LECTEURS=2 \
            -e OCR_MODELE_RECONNAISSANCE_ARABE=arabic_PP-OCRv5_mobile_rec \
            malica-ocr:banc
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8095/sante && break
            sleep 5
          done
          curl -fsS http://127.0.0.1:8095/sante

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer
        run: npm ci

      - name: Le moteur du sudoku
        run: |
          rustup target add wasm32-unknown-unknown
          npm run build --workspace @malica/sudoku

      - name: Monter le schéma
        run: node db/migrer.mjs --base "$DATABASE_URL_ADMIN" --mot-de-passe-api
        env:
          MALICA_API_PASSWORD: ci

      - uses: actions/cache@v4
        with:
          path: sortie/releves
          key: releves-${{ hashFiles('infra/ocr/**', 'outils/jeu-algoria/**', 'outils/jeu-synthetique/**') }}

      # Le banc échoue (code 1) dès qu'une valeur affirmée est fausse ou
      # inventée : c'est une mesure, son code est rapporté, et l'artefact part
      # quoi qu'il dise.
      - name: Le banc
        run: |
          mkdir -p sortie/releves
          cas=""
          [ -n "${{ inputs.cas }}" ] && cas="--cas ${{ inputs.cas }}"
          set +e
          node --experimental-strip-types --no-warnings \
            apps/api/src/malica/lecture/banc-sans-ia.ts \
            --corpus algoria:outils/jeu-algoria \
            --corpus synthetique:outils/jeu-synthetique \
            --corpus dirigeant:packages/sudoku/tests/donnees/jeux_dirigeant_ocr.json \
            --cache sortie/releves --entrees sortie/entrees $cas \
            --sortie sortie/banc.json > sortie/banc.md 2> sortie/banc.err
          code=$?
          echo "code de sortie du banc : $code" | tee sortie/code.txt
          cat sortie/banc.md >> "$GITHUB_STEP_SUMMARY"
          echo "::group::Le bulletin"
          cat sortie/banc.md
          echo "::endgroup::"
          # Toutes les pièces sans preuve, tous corpus : le bulletin dit combien,
          # cette liste dit lesquelles (le `tail` ci-dessous ne garde que la fin).
          echo "::group::Les pièces sans preuve"
          grep -E " (aucune|ambigue|sans_grille|signalee) — " sortie/banc.err || true
          echo "::endgroup::"
          # Pour chacune : la raison du moteur, puis ses champs sans lecture juste, avec la
          # valeur attendue et si elle est absente de la lecture (silence « normal », perte
          # de l'OCR) ou présente mais non attribuée (repère non reconnu, preuve non fermée).
          # Rejeu d'un cas (`cas` renseigné) : ce que le moteur a reçu, jeton par jeton
          # (page, ordinal, texte, position, montants lus), pour le rejouer en natif.
          if [ -n "${{ inputs.cas }}" ]; then
            echo "::group::Ce que le moteur a reçu"
            for f in sortie/entrees/*.json; do
              echo "## $f"
              echo "JSON $(cat "$f")"
              node -e '
                const e = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                for (const j of e.jetons ?? [])
                  console.log([j.page, j.ordinal, JSON.stringify(j.texte), j.x0?.toFixed(3), j.y0?.toFixed(3), JSON.stringify(j.montants ?? [])].join(" | "));
              ' "$f" || true
            done
            echo "::endgroup::"
          fi
          echo "::group::Les cases des pièces sans preuve"
          node -e '
            const m = JSON.parse(require("fs").readFileSync("sortie/banc.json", "utf8"));
            for (const p of m.filter((x) => x.issue !== "prouvee")) {
              console.log(`## ${p.corpus} ${p.id} [${p.type}] grille=${p.grille} issue=${p.issue} raison=${p.raison ?? "-"}`);
              for (const c of p.champs.filter((x) => x.issue === "silence" || x.issue === "faux"))
                console.log(`   ${c.issue}${c.normal ? " (absent de la lecture)" : " (présent, non attribué)"} ${c.champ} attendu=${JSON.stringify(c.attendu)}`);
            }
          ' || true
          echo "::endgroup::"
          grep -v "^moteur " sortie/banc.err | tail -60

      - name: Le journal du service OCR
        if: always()
        run: docker logs ocr > sortie/ocr.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: banc-moteur
          path: sortie/
          retention-days: 30
