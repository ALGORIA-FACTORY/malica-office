# La coque sur un émulateur — Maestro, avec l'API et le site de la machine
# hôte derrière (10.0.2.2), le jeu de données, et une image « Google APIs »
# pour que ML Kit existe.
#
# Chaque nuit et à la demande : un émulateur met dix minutes à se lever, ce
# n'est pas le prix d'une fusion. Ce qu'il éprouve, aucun navigateur ne le
# sait : l'abandon du scanner natif, le bouton retour matériel, le mode avion
# de l'appareil, l'arabe dans une WebView.
#
# SA LIMITE (D27, 17 septembre 2026) : dans cette WebView, un contenu qui
# apparaît après un geste, sans changement de page — le bandeau « Hors ligne »,
# le fil de Malica ouvert d'un tap — n'entre pas dans l'arbre que lit Maestro.
# Ces flux ne prouvent donc que ce qui est présent au chargement d'une page ; une
# assertion d'absence n'y prouve rien, et le hors ligne n'est pas vérifié ici.
#
# La saveur `emulateur` parle en clair à la machine hôte ; elle n'est jamais
# signée ni envoyée (voir android/app/build.gradle).

name: Android sur émulateur

on:
  schedule:
    - cron: "47 2 * * *" # 02:47 UTC
  workflow_dispatch:

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malica
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://malica_api:ci@localhost:5432/malica
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/malica
      JWT_SECRET: integration_continue_seulement_32_caracteres
      # Le jeu de données ouvre une session par compte, à la file, depuis une
      # seule adresse : la limite de trente connexions par minute — faite pour
      # freiner une devinette de mot de passe — le refuse (429). ci.yml la
      # relevait déjà ; cette épreuve de nuit ne la relevait pas, et échouait
      # chaque nuit depuis le 9 septembre 2026 sur « connexion refusée : 429 ».
      AUTH_ESSAIS_PAR_MINUTE: "1000"
      # Le contexte runner n'existe pas au niveau du job : un chemin fixe du runner Linux.
      STOCKAGE_RACINE: /tmp/malica-pieces
      # La WebView de l'émulateur se présente depuis http://localhost (clair, saveur emulateur).
      CORS_ORIGINS: http://localhost:8080,http://localhost,https://localhost

    steps:
      - uses: actions/checkout@v7

      # L'émulateur veut la virtualisation matérielle.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Installer
        run: npm ci

      - name: Monter le schéma
        run: node db/migrer.mjs --base "$DATABASE_URL_ADMIN" --mot-de-passe-api
        env:
          MALICA_API_PASSWORD: ci

      - name: Démarrer l'API et le site
        run: |
          (npm run start -w @malica/api > api.log 2>&1 &)
          (npm run dev -w @malica/web -- --host 0.0.0.0 > web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/sante >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/sante

      - name: Peupler le jeu de données
        run: node outils/jeu-de-donnees.mjs http://localhost:8080

      - name: Construire l'APK de l'émulateur
        run: |
          npm run build:coque:emulateur -w @malica/web
          MALICA_COQUE_EMULATEUR=1 npm run coque:sync -w @malica/web
          cd android && ./gradlew assembleEmulateurDebug -PversionName=0.0.0 --no-daemon

      # Les comptes de parcours vivent dans un seul fichier, lu aussi par
      # Playwright et captures.mjs ; Maestro les reçoit en variables (-e).
      - name: Les comptes de parcours
        run: |
          echo "MALICA_EMAIL=$(node -p "require('./outils/comptes-de-parcours.json').dirigeant.email")" >> "$GITHUB_ENV"
          echo "MALICA_MOT_DE_PASSE=$(node -p "require('./outils/comptes-de-parcours.json').motDePasse")" >> "$GITHUB_ENV"

      - name: Installer Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # L'émulateur n'a jamais démarré ici : « Not enough space to create
      # userdata partition. Available: 5639.93 MB, need 7372.80 MB »
      # (exécution 34994360064, 15 septembre 2026). Les nuits précédentes
      # tombaient plus tôt, sur le 429 du jeu de données, et le cachaient :
      # aucun flux Maestro n'a jamais tourné. La machine de GitHub porte des
      # chaînes d'outils dont ce job ne se sert pas ; on les retire, et le
      # disque de l'émulateur est borné.
      - name: Libérer de la place pour l'émulateur
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Lancer l'émulateur et les flux
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # Deux processeurs, rendu logiciel : l'interface système de l'émulateur
          # tarde, et Android pose « System UI isn't responding » par-dessus
          # l'application — les assertions ne voient plus l'écran, qui est
          # pourtant bien là (exécution 35091995778, capture de connexion). Ces
          # fenêtres d'erreur système sont masquées ; une vraie panne de
          # l'application reste visible, puisque son écran n'apparaît pas.
          #
          # Diagnostic D25 (17 septembre 2026), avant les flux : l'arbre
          # d'accessibilité relevé fil fermé, fil ouvert, hors ligne — la preuve
          # de ce que lit un lecteur d'écran, qu'une capture ne donne pas. Le
          # relevé est pris DANS le flux (une sonde optionnelle garde l'arbre) :
          # `maestro hierarchy`, lancé après, rendait un écran périmé
          # (exécution 35225328747 : l'écran de connexion, clavier ouvert).
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb install -r android/app/build/outputs/apk/emulateur/debug/app-emulateur-debug.apk
            maestro test -e MALICA_EMAIL="$MALICA_EMAIL" -e MALICA_MOT_DE_PASSE="$MALICA_MOT_DE_PASSE" android/maestro-diagnostic/arbre-fil.yaml || true
            maestro test -e MALICA_EMAIL="$MALICA_EMAIL" -e MALICA_MOT_DE_PASSE="$MALICA_MOT_DE_PASSE" android/maestro-diagnostic/arbre-hors-ligne.yaml || true

            # ================== CE QUE L'ÉMULATEUR DIT DE SON RÉSEAU, EN MODE AVION
            #
            # 13 octobre 2026. Le flux du mode avion échoue depuis le
            # 16 septembre : le bandeau « Hors ligne » n'apparaît pas. Deux
            # explications restaient possibles, et il fallait trancher sans
            # deviner — soit l'application ne voit pas la coupure, soit
            # l'émulateur ne coupe rien et c'est le flux qui demande
            # l'impossible.
            #
            # Le relevé ci-dessous répond : l'état du réglage, ce que le
            # gestionnaire de connectivité déclare, et si l'appareil joint
            # encore l'API. Il est pris pendant que le mode avion est ENCORE
            # actif — le `disable` vient après.
            echo "::group::Réseau de l'émulateur en mode avion"
            adb shell settings get global airplane_mode_on || true
            adb shell cmd connectivity airplane-mode || true
            adb shell dumpsys connectivity 2>/dev/null | sed -n '1,25p' || true
            echo "--- l'appareil joint-il encore l'API de l'hôte ?"
            # `curl` n'existe pas dans l'image de l'émulateur : la sonde passe
            # par la couche réseau d'Android, qui est justement ce qu'on teste.
            adb shell 'ping -c 1 -W 2 10.0.2.2 >/dev/null 2>&1 && echo joignable || echo injoignable' || true
            echo "--- l'heure de l'appareil, pour situer ce qui suit"
            adb shell date || true
            echo "--- ce que la coque et son greffon ont dit, DATÉ"
            # `-v threadtime` donne l'horodatage : sans lui on ne sait pas si
            # l'événement reçu est celui du mode avion ou celui du démarrage,
            # et c'est toute la question.
            adb logcat -d -v threadtime 2>/dev/null | grep -i "Capacitor" | tail -60 || true
            echo "::endgroup::"

            adb shell cmd connectivity airplane-mode disable || true
            node android/maestro-diagnostic/lire-arbre.mjs $(find ~/.maestro/tests -path '*arbre-*/screen-hierarchy/*.json' | sort) || true
            maestro test -e MALICA_EMAIL="$MALICA_EMAIL" -e MALICA_MOT_DE_PASSE="$MALICA_MOT_DE_PASSE" --format junit --output maestro.xml android/maestro/

      - name: Journaux
        if: failure()
        run: |
          echo "::group::api"; tail -100 api.log; echo "::endgroup::"
          echo "::group::web"; tail -100 web.log; echo "::endgroup::"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro
          path: |
            maestro.xml
            ~/.maestro/tests
            panneau-*.png
          retention-days: 7
