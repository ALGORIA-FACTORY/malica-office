# La coque sur un émulateur — Maestro, avec l'API et le site de la machine
# hôte derrière (10.0.2.2), le jeu de données, et une image Android sans
# services Google (voir « target » plus bas).
#
# Chaque nuit et à la demande : un émulateur met dix minutes à se lever, ce
# n'est pas le prix d'une fusion. Ce qu'il éprouve, aucun navigateur ne le
# sait : l'abandon du scanner natif, le bouton retour matériel, le mode avion
# de l'appareil, l'arabe dans une WebView.
#
# SA LIMITE (D27, 17 septembre 2026) : dans cette WebView, un contenu qui
# apparaît après un geste, sans changement de page — le bandeau « Hors ligne »,
# le fil de Malica ouvert d'un tap — n'entre pas dans l'arbre que lit Maestro.
# Ces flux ne prouvent donc que ce qui est présent au chargement d'une page ; une
# assertion d'absence n'y prouve rien, et le hors ligne n'est pas vérifié ici.
#
# LEVÉE (21 octobre 2026) : chaque flux déclare `androidWebViewHierarchy:
# devtools` ; Maestro lit alors la page par les outils de développement de la
# WebView (ouverts dans une construction de débogage), et non plus par l'arbre
# d'accessibilité figé. Le bandeau et le fil, bien à l'écran sur les captures
# de l'exécution 39107586977, y sont lus.
#
# La saveur `emulateur` parle en clair à la machine hôte ; elle n'est jamais
# signée ni envoyée (voir android/app/build.gradle).

name: Android sur émulateur

on:
  schedule:
    - cron: "47 2 * * *" # 02:47 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/src/routes/_authenticated/pme*.tsx"
      - "apps/web/src/components/malica/pme-context.tsx"
      - "apps/web/src/capabilities/**"
      - "apps/web/src/styles*.css"
      - "packages/socle/src/messages.ts"
      - "android/maestro/**"
      - ".github/workflows/android-e2e.yml"

concurrency:
  group: android-recette-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    # Ubuntu 24.04, pas ubuntu-latest : l'étiquette passe à Ubuntu 26 depuis le
    # 19 octobre 2026 (actions/runner-images#14748). L'émulateur tombait aussi
    # sur 24.04 (la cause était l'image google_apis, voir « target ») ; on
    # épingle tout de même l'image éprouvée plutôt qu'une image qui bouge.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malica
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://malica_api:ci@localhost:5432/malica
      # Les jeux d'essai déposent des lectures toutes faites (base locale seulement).
      MALICA_PORTES_D_ESSAI: "1"
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/malica
      JWT_SECRET: integration_continue_seulement_32_caracteres
      # Le jeu de données ouvre une session par compte, à la file, depuis une
      # seule adresse : la limite de trente connexions par minute — faite pour
      # freiner une devinette de mot de passe — le refuse (429). ci.yml la
      # relevait déjà ; cette épreuve de nuit ne la relevait pas, et échouait
      # chaque nuit depuis le 9 septembre 2026 sur « connexion refusée : 429 ».
      AUTH_ESSAIS_PAR_MINUTE: "1000"
      # Le contexte runner n'existe pas au niveau du job : un chemin fixe du runner Linux.
      STOCKAGE_RACINE: /tmp/malica-pieces
      # La WebView de l'émulateur se présente depuis http://localhost (clair, saveur emulateur).
      CORS_ORIGINS: http://localhost:8080,http://localhost,https://localhost

    steps:
      - uses: actions/checkout@v7

      # L'émulateur veut la virtualisation matérielle.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Installer
        run: npm ci

      - name: Monter le schéma
        run: node db/migrer.mjs --base "$DATABASE_URL_ADMIN" --mot-de-passe-api
        env:
          MALICA_API_PASSWORD: ci

      - name: Démarrer l'API et le site
        run: |
          (npm run start -w @malica/api > api.log 2>&1 &)
          (npm run dev -w @malica/web -- --host 0.0.0.0 > web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/sante >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/sante

      # Les comptes de parcours vivent dans un seul fichier, lu aussi par
      # Playwright et captures.mjs ; Maestro les reçoit en variables (-e).
      # Avant le jeu de données, qui imprime le mot de passe : il est masqué.
      - name: Les comptes de parcours
        run: |
          mot_de_passe="$(node -p "require('./outils/comptes-de-parcours.json').motDePasse")"
          echo "::add-mask::$mot_de_passe"
          echo "MALICA_EMAIL=$(node -p "require('./outils/comptes-de-parcours.json').dirigeant.email")" >> "$GITHUB_ENV"
          echo "MALICA_MOT_DE_PASSE=$mot_de_passe" >> "$GITHUB_ENV"

      - name: Peupler le jeu de données
        run: node outils/jeu-de-donnees.mjs http://localhost:8080

      - name: Construire l'APK de l'émulateur
        run: |
          npm run build:coque:emulateur -w @malica/web
          MALICA_COQUE_EMULATEUR=1 npm run coque:sync -w @malica/web
          cd android && ./gradlew assembleEmulateurDebug -PversionName=0.0.0 --no-daemon
          # --no-daemon ne couvre pas le démon Kotlin : il survit à la
          # construction et garde sa mémoire pendant tout l'émulateur.
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true

      - name: Installer Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # L'émulateur n'a jamais démarré ici : « Not enough space to create
      # userdata partition. Available: 5639.93 MB, need 7372.80 MB »
      # (exécution 34994360064, 15 septembre 2026). Les nuits précédentes
      # tombaient plus tôt, sur le 429 du jeu de données, et le cachaient :
      # aucun flux Maestro n'a jamais tourné. La machine de GitHub porte des
      # chaînes d'outils dont ce job ne se sert pas ; on les retire, et le
      # disque de l'émulateur est borné.
      - name: Libérer de la place pour l'émulateur
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      # L'émulateur disparaissait en plein flux, sans un mot dans son journal
      # (« device 'emulator-5554' not found », puis « could not connect to TCP
      # port 5554 » : exécutions 39220279148 et 39565902966, 19 et 21 octobre
      # 2026) — la signature d'un processus tué par le noyau à court de mémoire.
      # La machine porte à la fois Postgres, l'API, le site, Maestro et
      # l'émulateur. On lui donne de l'échange, et l'on relève la mémoire toutes
      # les dix secondes pour que la prochaine panne, s'il y en a une, se lise.
      - name: Mémoire d'échange et relevé de la mémoire
        run: |
          nproc; free -m; df -h / /mnt
          # Sur /mnt, le disque de travail : / garde sa place pour l'émulateur.
          sudo fallocate -l 6G /mnt/swapfile-emulateur
          sudo chmod 600 /mnt/swapfile-emulateur
          sudo mkswap /mnt/swapfile-emulateur > /dev/null
          sudo swapon /mnt/swapfile-emulateur
          free -m
          # systemd-oomd tue, sans trace dans le noyau, le plus gros groupe d'une
          # machine sous pression mémoire : l'émulateur. La machine est jetable.
          sudo systemctl stop systemd-oomd systemd-oomd.socket 2>/dev/null || true
          (vmstat -t 10 > vmstat.log 2>&1 &)
          (while true; do date -u +%T; ps -eo pid,rss,comm --sort=-rss | head -8; sleep 10; done > processus.log 2>&1 &)

      - name: Lancer l'émulateur et les flux
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Image AOSP, sans services Google. La machine de GitHub (dépôt privé)
          # n'a que 2 processeurs et 8 Go : avec l'image google_apis, les
          # services Google saturaient l'émulateur (« bg anr » de
          # com.google.android.gms.persistent), Android tuait l'application
          # qui dépendait de leur fournisseur de polices, puis qemu lui-même
          # tombait (cœur vidé, exécution 39583495404). ML Kit n'y servait à
          # rien : le greffon refuse le scanner sur tout émulateur.
          target: default
          arch: x86_64
          profile: pixel_6
          # 3 Go plutôt que 4 : la machine partage sa mémoire avec Postgres,
          # l'API, le site et Maestro (voir l'étape d'échange ci-dessus).
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: true
          # Pas de caméra émulée : le scanner ML Kit refuse de toute façon les
          # émulateurs (voir annuler-le-scanner.yaml), et la caméra virtuelle
          # coûte du processeur à une machine qui en manque.
          #
          # Rendu par ANGLE sur SwiftShader (swangle_indirect), plus
          # swiftshader_indirect : qemu tombait en SEGV dans son rendu GLES
          # cinq secondes après « Entrer », quand l'accueil se dessine
          # (coredumpctl, exécution 39587645730) — trois nuits de suite, au
          # même pas. (La WebView en --disable-gpu, essayée ensuite, plantait
          # son moteur de rendu : exécution 39591622354. On ne touche qu'au GPU
          # de l'émulateur.)
          emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          # Deux processeurs, rendu logiciel : l'interface système de l'émulateur
          # tarde, et Android pose « System UI isn't responding » par-dessus
          # l'application — les assertions ne voient plus l'écran, qui est
          # pourtant bien là (exécution 35091995778, capture de connexion). Ces
          # fenêtres d'erreur système sont masquées ; une vraie panne de
          # l'application reste visible, puisque son écran n'apparaît pas.
          #
          # Les sondes du diagnostic D25 (android/maestro-diagnostic) ne tournent
          # plus chaque nuit : elles ont rendu leur verdict (D27), coûtaient deux
          # connexions et un passage en mode avion avant les vrais flux, et
          # tombaient avec l'émulateur. Elles restent lançables à la main.
          #
          # Chaque ligne de `script` est un shell à part : la boucle des flux
          # (un flux à la fois, un seul rejeu sur déconnexion de l'émulateur,
          # jamais sur une assertion) vit dans android/maestro-ci.
          script: |
            adb wait-for-device
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb install -r android/app/build/outputs/apk/emulateur/debug/app-emulateur-debug.apk
            bash android/maestro-ci/lancer-les-flux.sh

      - name: Journaux
        if: failure()
        run: |
          echo "::group::api"; tail -100 api.log || true; echo "::endgroup::"
          echo "::group::web"; tail -100 web.log || true; echo "::endgroup::"
          echo "::group::mémoire"; free -m; tail -60 vmstat.log || true; echo "::endgroup::"
          echo "::group::noyau"; (sudo dmesg -T | grep -iE "out of memory|oom|killed process" | tail -20) || true; echo "::endgroup::"
          echo "::group::journal"; (sudo journalctl --no-pager -b | grep -iE "oom|killed|qemu|emulator" | tail -30) || true; echo "::endgroup::"
          echo "::group::processus"; tail -120 processus.log || true; echo "::endgroup::"
          echo "::group::cœurs vidés"; (sudo coredumpctl info --no-pager 2>&1 | head -80) || true; echo "::endgroup::"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro
          path: |
            maestro-*.xml
            maestro-*.log
            vmstat.log
            processus.log
            ~/.maestro/tests
            panneau-*.png
          retention-days: 7

