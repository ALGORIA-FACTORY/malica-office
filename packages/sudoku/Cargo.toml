[package]
name = "malica-sudoku"
version = "0.1.0"
edition = "2021"
description = "Le sudoku : lecture prouvée des pièces par les relations de leur grille (contrat docs/sudoku/contrat-du-moteur.md)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
