# L'émulateur AOSP n'a ni ML Kit ni caméra. Le scanner natif refuse ;
# notre cadrage s'ouvre et explique l'absence de caméra. Son abandon doit
# rendre le choix d'import intact, puis Retour doit rendre l'accueil.
# Ce flux ne constitue pas une validation du scanner ML Kit sur téléphone.
appId: com.algoriafactory.malica.emulateur
androidWebViewHierarchy: devtools
---
- launchApp
- runFlow: connexion.yaml
- tapOn: "Ajouter une pièce"
- assertVisible: "Importer des images"
- assertVisible: "Importer des PDF"
- takeScreenshot: ajout-trois-sources
- scrollUntilVisible:
    element: "Photographier"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: "Photographier"
- tapOn:
    text: "Lors de l'utilisation de l'application|While using the app|Autoriser|Allow"
    optional: true
- extendedWaitUntil:
    visible: "Annuler"
    timeout: 20000
- takeScreenshot: scanner-repli-sans-camera
- back
- assertVisible: "Importer des PDF"
- back
- assertVisible: "TVA · .*"
- assertNotVisible: "Une erreur est survenue."

