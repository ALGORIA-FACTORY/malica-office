# Ouvrir le scanner de l'appareil et l'abandonner : aucune erreur, l'écran
# d'avant intact. C'est le cas que le navigateur ne sait pas jouer — ML Kit
# est une activité des services Google, hors de la page.
appId: com.algoriafactory.malica.emulateur
androidWebViewHierarchy: devtools
---
- launchApp
- runFlow: connexion.yaml
- tapOn: "Photographier"
# La permission caméra, la première fois.
- tapOn:
    text: "Lors de l'utilisation de l'application|While using the app|Autoriser|Allow"
    optional: true
# L'activité ML Kit est ouverte : le retour matériel l'abandonne.
#
# Sur un émulateur, le greffon refuse d'ouvrir le scanner (« Document scanner
# is not supported on Android emulators », journal de l'appareil, exécution
# 39107586977) : l'accueil reste à l'écran, et un retour depuis l'accueil
# quitte l'application. On ne recule donc que si le scanner a pris l'écran ;
# sur la CI, ce flux prouve qu'un scanner indisponible ne casse pas l'accueil.
- runFlow:
    when:
      notVisible: "Vos documents"
    commands:
      - back
- assertVisible: "Vos documents"
- assertNotVisible: "Une erreur est survenue."
