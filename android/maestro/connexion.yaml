# Se connecter, arriver sur l'accueil du dirigeant.
#
# Sur l'émulateur de la CI (saveur `emulateur`, API de la machine hôte en
# 10.0.2.2). Le compte est celui du jeu de données, sur une base d'essai.
#
#   maestro test android/maestro/connexion.yaml
appId: tn.algoria.regalica.emulateur
---
- launchApp:
    clearState: true
- assertVisible: "Espace Regalica Office"
- tapOn: "Adresse e-mail"
- inputText: "contact@sotumag.tn"
- tapOn: "Mot de passe"
- inputText: "JeuDeDonnees2026!"
- hideKeyboard
- tapOn: "Entrer"
# À la toute première visite, le fil de Regalica recouvre l'accueil : on le referme.
- tapOn:
    text: "Fermer le fil de Regalica"
    optional: true
    timeout: 20000
- assertVisible:
    text: "Vos documents"
    timeout: 20000
