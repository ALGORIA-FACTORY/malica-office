# Se connecter, arriver sur l'accueil du dirigeant.
#
# Sur l'émulateur de la CI (saveur `emulateur`, API de la machine hôte en
# 10.0.2.2). Le compte est celui du jeu de données, sur une base d'essai.
#
#   maestro test android/maestro/connexion.yaml
appId: com.algoriafactory.malica.emulateur
---
# Chaque flux part d'un appareil en ligne. Un flux qui échoue en mode avion
# (mode-avion.yaml) laissait l'émulateur hors ligne, et le flux suivant
# tombait sur « Pas de connexion » (exécution 35093087941).
- setAirplaneMode: disabled
- launchApp:
    clearState: true
- assertVisible: "Espace Malica Office"
- tapOn: "Adresse e-mail"
- inputText: "contact@sotumag.tn"
- tapOn: "Mot de passe"
- inputText: "JeuDeDonnees2026!"
- hideKeyboard
- tapOn: "Entrer"
# À la toute première visite, le fil de Malica recouvre l'accueil (c'est voulu :
# usePanneauMalica l'ouvre tant qu'aucun choix n'est retenu) : on le referme.
# Le 16 septembre, on a cru qu'il s'ouvrait APRÈS l'accueil ; c'était faux — le
# flux tapait un bouton recouvert et ne le fermait jamais (voir plus bas).
#
# Maestro n'accepte pas `timeout` sur tapOn ni assertVisible — « Unknown
# Property: timeout » (CI du 16 septembre 2026, le premier jour où ces flux ont
# été lus : l'émulateur n'avait jamais démarré avant). Attendre, c'est
# extendedWaitUntil.
#
# « Fermer le fil de Malica » a désigné deux boutons : la croix du fil, et le
# visage de Malica sur l'accueil — recouvert par le fil, mais lisible sous lui.
# Maestro tapait le visage, sans effet (exécution 35094473857). C'était un défaut
# de l'application, pas du flux : un utilisateur de TalkBack aurait fait de même.
# Depuis EcranPlein (17 septembre 2026), ce que recouvre un écran plein est
# inerte : seule la croix répond à ce nom. On exige que le fil soit FERMÉ, pas
# seulement que l'accueil existe quelque part sous lui.
#
# Le fil ouvert, l'accueil n'est plus lisible sous lui : on attend donc l'un OU
# l'autre (le texte cherché est une expression régulière), puis on ferme.
- extendedWaitUntil:
    visible: "Fermer le fil de Malica|Vos documents"
    timeout: 20000
- tapOn:
    text: "Fermer le fil de Malica"
    optional: true
- assertNotVisible: "Conversation en cours"
- assertVisible: "Vos documents"
