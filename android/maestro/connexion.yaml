# Se connecter, arriver sur l'accueil du dirigeant.
#
# Sur l'émulateur de la CI (saveur `emulateur`, API de la machine hôte en
# 10.0.2.2). Le compte est celui du jeu de données, sur une base d'essai.
#
#   maestro test android/maestro/connexion.yaml
appId: com.algoriafactory.malica.emulateur
---
- launchApp:
    clearState: true
- assertVisible: "Espace Malica Office"
- tapOn: "Adresse e-mail"
- inputText: "contact@sotumag.tn"
- tapOn: "Mot de passe"
- inputText: "JeuDeDonnees2026!"
- hideKeyboard
- tapOn: "Entrer"
# À la toute première visite, le fil de Malica recouvre l'accueil : on le referme.
#
# Maestro n'accepte pas `timeout` sur tapOn ni assertVisible — « Unknown
# Property: timeout » (CI du 16 septembre 2026, le premier jour où ces flux ont
# été lus : l'émulateur n'avait jamais démarré avant). Attendre, c'est
# extendedWaitUntil.
- extendedWaitUntil:
    visible: "Fermer le fil de Malica"
    timeout: 20000
    optional: true
- tapOn:
    text: "Fermer le fil de Malica"
    optional: true
- extendedWaitUntil:
    visible: "Vos documents"
    timeout: 20000
