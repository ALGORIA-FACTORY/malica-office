# Se connecter, arriver sur l'accueil du dirigeant.
#
# Sur l'émulateur de la CI (saveur `emulateur`, API de la machine hôte en
# 10.0.2.2). Le compte est celui du jeu de données, sur une base d'essai.
#
#   maestro test android/maestro/connexion.yaml
appId: com.algoriafactory.malica.emulateur
---
# Chaque flux part d'un appareil en ligne. Un flux qui échoue en mode avion
# (mode-avion.yaml) laissait l'émulateur hors ligne, et le flux suivant
# tombait sur « Pas de connexion » (exécution 35093087941).
- setAirplaneMode: disabled
- launchApp:
    clearState: true
- assertVisible: "Espace Malica Office"
- tapOn: "Adresse e-mail"
- inputText: "contact@sotumag.tn"
- tapOn: "Mot de passe"
- inputText: "JeuDeDonnees2026!"
- hideKeyboard
- tapOn: "Entrer"
# À la toute première visite, le fil de Malica recouvre l'accueil : on le
# referme. Il peut s'ouvrir AVANT ou APRÈS que l'accueil s'affiche — sur
# l'émulateur de la CI, il est venu après, et recouvrait « Mon espace » pour
# les flux suivants (exécution 35093087941). On le guette donc des deux côtés.
#
# Maestro n'accepte pas `timeout` sur tapOn ni assertVisible — « Unknown
# Property: timeout » (CI du 16 septembre 2026, le premier jour où ces flux ont
# été lus : l'émulateur n'avait jamais démarré avant). Attendre, c'est
# extendedWaitUntil.
#
# « Fermer le fil de Malica » désigne DEUX boutons quand le fil est ouvert : la
# croix de son en-tête, et le visage de Malica sur l'accueil — recouvert par le
# fil, mais présent dans la hiérarchie que lit Maestro. Tapé seul, le texte
# visait le visage, sous le fil : le tap ne faisait rien, et « Vos documents »,
# lu sous le fil, laissait croire l'accueil dégagé (exécution 35094473857,
# journal maestro.log). On vise la croix — la seule au-dessus de « Mes
# conversations » — et on vérifie que le fil est FERMÉ, pas seulement que
# l'accueil existe quelque part sous lui.
- extendedWaitUntil:
    visible: "Vos documents"
    timeout: 20000
- extendedWaitUntil:
    visible: "Mes conversations"
    timeout: 8000
    optional: true
- tapOn:
    text: "Fermer le fil de Malica"
    above: "Mes conversations"
    optional: true
- assertNotVisible: "Conversation en cours"
