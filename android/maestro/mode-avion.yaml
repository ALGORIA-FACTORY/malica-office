# Le hors ligne : en mode avion, la coque le dit d'un bandeau et garde
# l'écran ; au retour du réseau, le bandeau tombe. La capture elle-même (le
# scanner, la file qui se vide) se joue sur appareil réel — protocole
# d'appareil, points 7 et 8.
appId: com.algoriafactory.malica.emulateur
---
- launchApp
- runFlow: connexion.yaml
- setAirplaneMode: enabled
# Attendre, c'est extendedWaitUntil : assertVisible n'accepte pas de timeout.
- extendedWaitUntil:
    visible: "Hors ligne — vos photos partiront au retour du réseau."
    timeout: 10000
- tapOn: "Mon espace"
- assertVisible: "Visible par vous seul"
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible: "Hors ligne — vos photos partiront au retour du réseau."
    timeout: 20000
