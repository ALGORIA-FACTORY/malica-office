# L'arabe : les réglages changent la langue, l'application se retourne.
appId: com.algoriafactory.regalica.emulateur
---
- launchApp
- runFlow: connexion.yaml
- tapOn: "Mon espace"
- tapOn: "Réglages"
- assertVisible: "Langue"
- tapOn: "العربية"
- assertVisible: "الإعدادات"
- assertVisible: "اللغة"
# Retour au français, pour les flux suivants.
- tapOn: "Français"
- assertVisible: "Réglages"
