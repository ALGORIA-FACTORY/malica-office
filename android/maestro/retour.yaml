# Le bouton retour d'Android : il recule d'un écran, jamais hors de
# l'application depuis un écran intérieur ; depuis l'accueil, il quitte.
appId: com.algoriafactory.malica.emulateur
androidWebViewHierarchy: devtools
---
- launchApp
- runFlow: connexion.yaml
- tapOn: "Mon espace"
# Le titre de « Mon espace » depuis le 21 octobre 2026 (« Visible par vous
# seul » a disparu de l'écran).
- assertVisible: "Vos papiers"
- back
# L'accueil du 23 octobre 2026 s'ouvre sur le chiffre du mois (« TVA · <mois> »).
- assertVisible: "TVA · .*"
# Malica, ouverte de l'accueil, se referme d'un retour. Depuis le 21 octobre
# 2026, c'est un écran (/pme/malica) et non plus un fil par-dessus l'accueil ;
# depuis le 23 octobre, on l'ouvre par « Me demander », sur sa carte, plus bas.
# Centrée : la lecture par les outils de développement donne la barre pour
# visible alors qu'elle est encore sous la barre basse épinglée (exécution
# 39627240476 : le tap tombait sur la barre basse).
- scrollUntilVisible:
    element: "Me demander"
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: "Me demander"
- extendedWaitUntil:
    visible: "Je cite l'article.*"
    timeout: 20000
# L'accueil revient à l'endroit où on l'avait laissé, défilé jusqu'à la carte
# de Malica : c'est elle qui le prouve, pas le chiffre du mois, plus haut.
- back
- assertVisible: "Me demander"
# Depuis l'accueil, le retour quitte : l'application n'est plus au premier plan.
- back
- assertNotVisible: "Me demander"
