// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    /*
     * Un dépôt synchronisé (OneDrive) verrouille les fichiers que Gradle écrit
     * par milliers : AccessDeniedException au milieu d'une construction. La
     * propriété `dossierBuild` — posée dans ~/.gradle/gradle.properties sur le
     * poste, jamais dans le dépôt — sort les sorties de build hors du dossier
     * synchronisé. Sans elle (la CI), tout reste sous android/.
     */
    if (project.hasProperty('dossierBuild')) {
        layout.buildDirectory = file("${project.property('dossierBuild')}/${project.name}")
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
