# Malica Office — tous les services dans des conteneurs, la base sur pg-shared.
#
#   scripts/init-env.sh        crée env/*.env et génère les secrets
#   scripts/bootstrap-db.sh    prépare la base `malica` sur pg-shared (une fois)
#   docker compose -f docker/compose.yml up -d --build
#
# Profils optionnels : `ocr` (second lecteur, 2 Go) et `sauvegarde` (dumps + restic).
#   docker compose -f docker/compose.yml --profile ocr --profile sauvegarde up -d
#
# Pré-requis : la pile ~/pg-shared tourne (le réseau externe pg-shared-net existe).
# Contextes de construction : la racine du dépôt (api, web), infra/ocr, infra/sauvegarde.

name: malica

x-journal: &journal
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

networks:
  pg-shared:
    name: pg-shared-net
    external: true

services:
  # Joue les migrations manquantes puis s'arrête ; l'API attend sa fin.
  migrate:
    build: { context: .., dockerfile: docker/dockerfiles/api.Dockerfile }
    image: malica-api:local
    command: ["node", "db/migrer.mjs"]
    working_dir: /srv
    env_file: env/migrate.env
    networks: [pg-shared]
    restart: "no"
    logging: *journal

  api:
    build: { context: .., dockerfile: docker/dockerfiles/api.Dockerfile }
    image: malica-api:local
    restart: unless-stopped
    env_file: env/api.env
    networks: [default, pg-shared]
    volumes:
      - pieces:/pieces
      - journal_attente:/journal
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *journal

  web:
    build: { context: .., dockerfile: docker/dockerfiles/web.Dockerfile }
    image: malica-web:local
    restart: unless-stopped
    env_file: env/web.env
    depends_on:
      api: { condition: service_healthy }
    logging: *journal

  caddy:
    image: caddy:2.9
    restart: unless-stopped
    env_file: env/caddy.env
    ports:
      - "127.0.0.1:${MALICA_PORT:-8090}:80"
    volumes:
      # Le DOSSIER (pas le fichier) : un remplacement du Caddyfile reste suivi. Une seule source : infra/caddy.
      - ../infra/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    logging: *journal

  # Le second lecteur. Mémoire bornée : un modèle trop gros tue le conteneur, jamais la base.
  # Pour l'utiliser : renseigner OCR_URL=http://ocr:8000 dans env/api.env, puis recréer l'api.
  ocr:
    profiles: ["ocr"]
    build: { context: ../infra/ocr, dockerfile: ../../docker/dockerfiles/ocr.Dockerfile }
    image: malica-ocr:local
    restart: unless-stopped
    env_file: env/ocr.env
    deploy: { resources: { limits: { memory: 2g } } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/sante"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging: *journal

  sauvegarde:
    profiles: ["sauvegarde"]
    build: { context: ../infra/sauvegarde, dockerfile: ../../docker/dockerfiles/sauvegarde.Dockerfile }
    image: malica-sauvegarde:local
    restart: unless-stopped
    env_file: env/sauvegarde.env
    networks: [default, pg-shared]
    volumes:
      - pieces:/pieces:ro
      - sauvegardes:/sauvegardes
      - restic_repo:/restic
      - restic_cache:/root/.cache/restic
    logging: *journal

volumes:
  pieces:
  journal_attente:
  caddy_data:
  caddy_config:
  sauvegardes:
  restic_repo:
  restic_cache:
