# Malica Office — un environnement complet sur une machine.
#
# Le même fichier sert staging, pilote et production ; seul `.env` change.
# Une origine publique par environnement : Caddy prend le TLS et route vers
# l'API (les chemins de caddy/Caddyfile, les mêmes que le relais de
# développement) et vers le site pour tout le reste.
#
# Sur le serveur, tout passe par deployer.sh, qui lance compose avec
# `--project-directory /srv/malica/depot/infra --env-file /srv/malica/.env` :
# les chemins relatifs ci-dessous partent de ce dossier.
#
# Les images sont construites par la CI (images.yml) et publiées sur GHCR,
# étiquetées par la version du dépôt ; deployer.sh les tire.

name: malica

services:
  caddy:
    image: caddy:2.9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE: ${DOMAINE}
      DOMAINE_ALIAS: ${DOMAINE_ALIAS:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    logging: &journal
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  # Joue les migrations manquantes puis s'arrête. L'API et le site attendent
  # sa fin : un schéma en retard ne sert jamais une requête. Pose aussi le mot
  # de passe du rôle de l'API : le changer dans .env suffit.
  migrer:
    image: ${REGISTRE}/malica-api:${VERSION}
    command: ["node", "db/migrer.mjs", "--mot-de-passe-api"]
    working_dir: /srv
    environment:
      DATABASE_URL_ADMIN: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/malica
      MALICA_API_PASSWORD: ${MALICA_API_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *journal

  # ====================================== LE SECOND LECTEUR, DANS SA BOITE
  #
  # Appele seulement quand la premiere lecture sort partielle. Mesure le
  # 13 octobre 2026 sur treize pieces reelles : 20 montants trouves par lui
  # seul, 4 par la chaine actuelle seule (docs/mesure-paddleocr-2026-10-13.md).
  #
  # La LIMITE MEMOIRE n'est pas un ornement : les modeles « medium » ont fait
  # tuer le conteneur a 1,81 Go lors de la mesure, et c'est exactement ce
  # qu'on veut — le conteneur meurt, la base de donnees ne bronche pas.
  #
  # Image EPINGLEE par sa version : un conteneur qui se met a jour tout seul
  # changerait le releve sans qu'une ligne de code bouge (R8).
  ocr:
    image: ${REGISTRE}/malica-ocr:${VERSION}
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "2"
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/sante"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  api:
    image: ${REGISTRE}/malica-api:${VERSION}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://malica_api:${MALICA_API_PASSWORD}@postgres:5432/malica
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: https://${DOMAINE},https://${DOMAINE_ALIAS:-localhost},https://localhost
      STOCKAGE_RACINE: /pieces
      CLIENT_MIN_VERSION: ${CLIENT_MIN_VERSION:-}
      AUTH_ESSAIS_PAR_MINUTE: ${AUTH_ESSAIS_PAR_MINUTE:-30}
      MALICA_VERSION: ${VERSION}
      # Le second lecteur, quand il est deploye. ABSENTE, la chaine se
      # comporte exactement comme avant : une lecture partielle reste une
      # lecture partielle, jamais une panne.
      OCR_URL: ${OCR_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL}
      QWEN_OCR_MODEL: ${QWEN_OCR_MODEL}
    volumes:
      - ${PIECES_DIR}:/pieces
    depends_on:
      migrer:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/sante').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *journal

  web:
    image: ${REGISTRE}/malica-web:${VERSION}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      # Vu du serveur web, l'API est à côté : jamais par l'origine publique.
      VITE_API_URL: http://api:3000
    depends_on:
      migrer:
        condition: service_completed_successfully
    logging: *journal

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: malica
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=100"]
    volumes:
      - ${POSTGRES_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d malica"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *journal

  # Un dump toutes les six heures, chiffré et poussé hors site par restic avec
  # les pièces (sauvegarde/). Le même conteneur restaure : restaurer.sh.
  sauvegarde:
    image: ${REGISTRE}/malica-sauvegarde:${VERSION}
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      SAUVEGARDE_SIGNAL_URL: ${SAUVEGARDE_SIGNAL_URL:-}
    volumes:
      - ${PIECES_DIR}:/pieces:ro
      - ${RESTAURATION_DIR}:/restauration
      - sauvegardes:/sauvegardes
      - restic_cache:/root/.cache/restic
      - ${RESTIC_CLE_SSH}:/root/.ssh/id_ed25519:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *journal

volumes:
  caddy_data:
  caddy_config:
  sauvegardes:
  restic_cache:
